name: One Piece Fan Page — GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar scripts e conteúdo
        run: |
          node --check js/data.js
          node --check js/navigation.js
          node --check js/script.js
          test -f index.html
          test -f view/home.html
          test -f view/characters.html
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar artefato público, sem arquivos de desenvolvimento
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js media view fontawesome-free-6.5.1-web _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/js/script.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
