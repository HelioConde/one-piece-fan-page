name: One Piece Fan Page — GitHub Pages
on:
  workflow_run:
    workflows: ["Fan Page QA"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    # Nunca publicar código cujo QA falhou, foi cancelado ou é de um commit obsoleto.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_sha == github.sha) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar scripts e conteúdo
        run: |
          node --check js/data.js
          node --check js/navigation.js
          node --check js/script.js
          test -f index.html
          test -f view/home.html
          test -f view/characters.html
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Preparar artefato público, sem arquivos de desenvolvimento
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js media view fontawesome-free-6.5.1-web _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/js/script.js
          test ! -e _site/tests
          test ! -e _site/package.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
