name: Fan Page QA
on:
  push:
    branches: [main, feat/modernizacao-fan-page-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Verificar sintaxe
        run: npm run check
      - name: Testar navegação, responsividade e acessibilidade
        run: npm test
      - name: Salvar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
